<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GaitLab — Running Gait Analysis</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-nav="#/upload">
      <span class="brand-mark">⏱</span>
      <span class="brand-name">GaitLab</span>
      <span class="brand-tag">running gait analysis</span>
    </div>
    <nav class="topnav">
      <a data-nav="#/library" data-capability="history" hidden>Library</a>
      <a data-nav="#/trends" data-capability="history" hidden>Trends</a>
      <a data-nav="#/combine" data-capability="history" hidden>Combine</a>
      <div id="user-area" data-capability="users" hidden></div>
      <a class="btn btn-accent" data-nav="#/upload">+ New analysis</a>
    </nav>
  </header>

  <main id="app"><div class="loading">Loading…</div></main>

  <footer class="foot">
    <span id="runtime-note">Runs entirely in your browser · no account, no upload · pose by MediaPipe (in-browser)</span>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
